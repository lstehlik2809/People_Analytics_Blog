name: People Analytics News

on:
  schedule:
    # 07:17 Prague time is 05:17 UTC in summer and 06:17 UTC in winter.
    - cron: '17 5,6 * * *'
    # Retry later if no edition has been saved today.
    - cron: '43 9 * * *'
    # One-off verification slot on November 13, 2026. Remove after checking the run.
    - cron: '19 10 13 11 *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: people-analytics-news
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Test the collector
        run: python -B -m unittest discover -s scripts -p 'test_*.py'

      - name: Collect and render news
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          prague_time=$(TZ=Europe/Prague date +%H%M)
          if [[ "$GITHUB_EVENT_NAME" == 'schedule' && "$prague_time" < '0717' ]]; then
            echo 'Waiting for the 07:17 Prague collection window.'
            exit 0
          fi
          python scripts/collect_news.py

      - name: Publish generated news files
        run: |
          git add -- news_archive \
            news-assets/news-data.json news-assets/news.xml news-assets/news-digest.md \
            _site/news-assets/news-data.json _site/news-assets/news.xml _site/news-assets/news-digest.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update People Analytics News'
          git push origin "HEAD:$GITHUB_REF"
