name: People Analytics News Recovery

on:
  schedule:
    - cron: '47 5,6,8,10 * * *'
    - cron: '23 7,9,11 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: people-analytics-news-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch News if today's edition is missing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          prague_now=$(TZ=Europe/Prague date '+%F %H%M')
          read -r day local_time <<< "$prague_now"
          if [[ "$GITHUB_EVENT_NAME" == schedule && "$local_time" < 0717 ]]; then
            echo 'The 07:17 Prague collection window has yet to open.'
            exit 0
          fi

          archive_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" --get --data-urlencode "ref=$DEFAULT_BRANCH" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/contents/news_archive/$day.json")
          case "$archive_status" in
            200) echo "The News edition for $day is already saved."; exit 0 ;;
            404) ;;
            *) echo "Could not check the News archive for $day (HTTP $archive_status)." >&2; exit 1 ;;
          esac

          workflow="repos/$GITHUB_REPOSITORY/actions/workflows/people-analytics-news.yml"
          active_runs=$(gh api --method GET --paginate "$workflow/runs" \
            -f branch="$DEFAULT_BRANCH" -f per_page=100 \
            --jq '.workflow_runs[] | select(.status != "completed") | .id')
          if [[ -n "$active_runs" ]]; then
            echo 'A News run is already active.'
            exit 0
          fi

          gh api --method POST "$workflow/dispatches" -f ref="$DEFAULT_BRANCH"
          echo "Dispatched News collection for $day."
