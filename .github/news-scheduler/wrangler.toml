name = "people-analytics-news-scheduler"
main = "worker.mjs"
compatibility_date = "2026-11-15"
workers_dev = false
preview_urls = false

[triggers]
crons = ["2,17,32,47 5-11 * * *"]

[secrets]
required = ["GITHUB_APP_ID", "GITHUB_INSTALLATION_ID", "GITHUB_APP_PRIVATE_KEY"]

[observability.logs]
enabled = true
head_sampling_rate = 1
